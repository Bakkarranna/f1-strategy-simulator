[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "f1sim"
version = "1.0.0"
description = "Pit stop strategy simulator and Monte Carlo race model for Formula 1"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Muhammad Abubakar Siddique" }]
keywords = ["formula-1", "f1", "race-strategy", "simulation", "monte-carlo"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
f1sim = "f1sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/f1sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
